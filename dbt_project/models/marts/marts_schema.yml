version: 2

models:
  - name: fct_transactions
    description: "Daily transactional fact table with operational latency metrics."
    tests:
      # Elementary Statistical Anomaly Tests
      - elementary.volume_anomalies:
          config:
            severity: warn
          arguments:
            timestamp_column: transaction_created_at
            time_bucket:
              period: day
              count: 1
      - elementary.dimension_anomalies:
          arguments:
            dimensions:
              - transaction_type
              - settlement_status
            timestamp_column: transaction_created_at
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: sender_dim_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_dim_key
      - name: receiver_dim_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_dim_key
