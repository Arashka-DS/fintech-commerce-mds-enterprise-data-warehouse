version: 2

sources:
  - name: raw_fintech
    schema: raw_fintech
    tables:
      - name: customers
        description: "OLTP raw user profile and credit limit registry."
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
      - name: transactions
        description: "Raw interbank and POS financial transaction log."
        columns:
          - name: transaction_id
            tests:
              - unique
              - not_null

  - name: raw_qcommerce
    schema: raw_qcommerce
    tables:
      - name: darkstores
        description: "Micro-fulfillment darkstore master table."
        columns:
          - name: store_id
            tests:
              - unique
              - not_null
      - name: orders
        description: "Raw lifecycle timestamps for 15-to-30 minute grocery delivery."
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
