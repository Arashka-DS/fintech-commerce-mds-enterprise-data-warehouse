version: 2

models:
  - name: stg_customers
    description: "Cleaned customer staging view with standardized data types."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: national_id_hash # FIXED: Was national_id
        tests:
          - not_null

  - name: stg_transactions
    description: "Cleaned transaction ledger with standardized timestamps."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: amount_irr
        tests:
          - not_null
