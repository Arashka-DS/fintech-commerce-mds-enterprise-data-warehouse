x-airflow-common: &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_mds/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
  depends_on:
    postgres_mds:
      condition: service_healthy

services:
  postgres_mds:
    image: postgres:15-alpine
    container_name: mds_warehouse
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5532:5432"
    volumes:
      - ./init_raw_data.sql:/docker-entrypoint-initdb.d/init_raw_data.sql
      - pg_mds_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_mds/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_MIGRATE=true # FIXED: Replaced deprecated _AIRFLOW_DB_UPGRADE
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

  metabase_db:
    image: postgres:15
    container_name: metabase_internal_db
    environment:
      POSTGRES_USER: mb_user
      POSTGRES_PASSWORD: mb_password
      POSTGRES_DB: metabase_app
    volumes:
      - metabase_pg_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: mds_metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_app
      - MB_DB_PORT=5432
      - MB_DB_USER=mb_user
      - MB_DB_PASS=mb_password
      - MB_DB_HOST=metabase_db
    depends_on:
      metabase_db:
        condition: service_started
      postgres_mds:
        condition: service_healthy

volumes:
  pg_mds_data:
  metabase_pg_data:
